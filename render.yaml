# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Docker image as a public demo: sample dataset + offline mock provider.
# To lock it down or use a real LLM, add DATASAGE_API_KEYS (and DATASAGE_PROVIDER,
# DATASAGE_LLM_API_KEY, ...) as secret environment variables in the Render dashboard.
services:
  - type: web
    name: datasage-ai-analyst
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATASAGE_PROVIDER
        value: mock
      # Render's proxy appends the real client IP to X-Forwarded-For (per-client rate limits)
      - key: DATASAGE_TRUST_PROXY
        value: "true"
